name: Vérifier les annonces Leboncoin
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: redcent-stock
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier les annonces suivies
        run: python scripts/check_leboncoin.py
      - name: Publier les changements confirmés
        run: |
          if ! git diff --quiet -- stock.json; then
            git config user.name "redcent-stock-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stock.json
            git commit -m "Stock: dépublication Leboncoin confirmée"
            git push
          fi
